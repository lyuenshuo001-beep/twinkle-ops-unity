<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10191c;color:#e0e8e6;font-family:system-ui,"Microsoft YaHei",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}header{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #304344;background:#10191c}header strong{letter-spacing:2px;font-size:16px}header span{font-size:11px;color:#94aca8;letter-spacing:2px;margin-left:16px}nav{display:flex;gap:16px;align-items:center}a,button{color:#b8d4c9;background:transparent;text-decoration:none;font:inherit;font-size:12px}button{border:1px solid #4e6c62;border-radius:3px;padding:7px 16px;cursor:pointer}button:hover{background:#26433a}main{flex:1;min-height:0;position:relative;overflow:hidden}canvas{position:absolute;inset:0;min-width:0;min-height:0;width:100%;height:100%;display:block;outline:none;touch-action:none;background:#111b1f}#loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 60% 20%,#24383a,#0a1114 70%)}.card{width:min(550px,85vw)}.eyebrow{font-size:12px;letter-spacing:5px;color:#7fa59b}.card h1{font-size:clamp(38px,6vw,68px);margin:17px 0 8px;letter-spacing:5px}.card p{color:#a3b4b2;font-size:14px;line-height:1.8}.track{height:3px;background:#34423f;margin-top:32px}.fill{height:100%;width:0;background:#b3d8aa;transition:width .2s}#progress{display:flex;justify-content:space-between;font-size:12px;margin-top:12px;color:#94b6a7}#error{display:none;color:#ffc3ac;white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto}footer{height:32px;flex-shrink:0;font-size:11px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;color:#78918b}#rotate{display:none;position:absolute;bottom:24px;padding:12px 20px;background:#152924e8;border:1px solid #547267;border-radius:6px;pointer-events:none;font-size:13px}@media(max-width:700px){header{height:43px;padding:0 12px}header span <header><div><strong>TWINKLE OPS</strong><span>闪烁行动 / 隔离区 01</span></div><nav><a href="credits.html" target="_blank" rel="noopener">资源署名</a><button id="fullscreen" type="button">全屏试玩</button></nav></header>
<main id="stage"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="闪烁行动游戏画面"></canvas><div id="loading"><div class="card"><div class="eyebrow">EXTRACTION / SURVIVAL</div><h1>闪烁行动</h1><p>进入隔离区。搜寻物资。活着撤离。</p><p>联通工业园 · 逐件搜索 · 安全箱与物资整备 · M4A1 / AKM / M9 / M870</p><div class="track"><div class="fill" id="bar"></div></div><div id="progress"><span id="status">正在载入战区</span><span id="percent">0%</span></div><p style="font-size:12px">首次加载需要下载游戏资源，之后可使用浏览器缓存。<br>推荐 PC 键鼠；手机请横屏，使用屏幕触控。</p><p id="error"></p></div></div><div id="rotate">请将手机横屏，获得完整视野与触控布局</div></main>

<script>
const canvas=document.getElementById('unity-canvas');let game;
function fail(message){document.getElementById('loading').style.display='grid';document.getElementById('status').textContent='加载未完成';const error=document.getElementById('error');error.style.display='block';error.textContent='请刷新页面重试，并确认浏览器支持 WebGL 2。\n'+String(message);console.error(message)}
const script=document.createElement('script');script.src='Build/Web.loader.js?v=__VERSION__';script.onerror=()=>fail('无法下载游戏启动文件，请检查网络。');
script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/Web.data.unityweb?v=__VERSION__',frameworkUrl:'Build/Web.framework.js.unityweb?v=__VERSION__',codeUrl:'Build/Web.wasm.unityweb?v=__VERSION__',streamingAssetsUrl:'StreamingAssets',companyName:'TwinkleOps',productName:'TWINKLE OPS',productVersion:'1.2.0-alpha',devicePixelRatio:Math.min(window.devicePixelRatio||1,1),autoSyncPersistentDataPath:true,showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message)}},p=>{document.getElementById('bar').style.width=(p*100)+'%';document.getElementById('percent').textContent=Math.round(p*100)+'%';if(p>.9)document.getElementById('status').textContent='正在准备大厅'}).then(instance=>{game=instance;document.getElementById('loading').style.display='none';canvas.focus();window.twinkleReady=true}).catch(fail);
document.body.appendChild(script);document.getElementById('fullscreen').onclick=()=>{if(game){game.SetFullscreen(1);canvas.focus()}};
canvas.addEventListener('pointerdown',()=>canvas.focus());window.addEventListener('keydown',e=>{if(document.activeElement===canvas&&['Tab',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()},{capture:true});
